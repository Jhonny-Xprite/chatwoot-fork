# ============================================================================
# IMPLEMENTATION NOTES FOR DEVELOPERS
# ============================================================================
implementation_notes:
  technical_decisions_rationale:
    - decision: "Soft deletes instead of hard deletes (S4.1)"
      rationale: "Preserves data integrity, enables rollback, tracks merge history"
      alternative_rejected: "Hard deletes (risky, unrecoverable)"

    - decision: "Frontend filtering instead of backend (S2.2)"
      rationale: "Simpler, no API changes, good for < 1000 contacts"
      alternative_rejected: "Backend pagination (more complex, requires migration)"

    - decision: "Virtual scrolling for drag (S3.1)"
      rationale: "Maintains 60 FPS with 100+ cards"
      alternative_rejected: "Render all cards (performance bloat, fails FPS target)"

  code_standards:
    - "Vue 3 Composition API for new components (S3.1, S4.1)"
    - "TypeScript for complex logic (deduplication, drag state)"
    - "SCSS for styling, use CSS custom properties (--color-* tokens)"
    - "Database migrations for S1.3, S4.1 (Rails 6+ format)"
    - "Unit tests for business logic (fuzzy match, merge algorithm)"
    - "Integration tests for API contracts (PATCH /contacts/{id})"

  common_pitfalls_to_avoid:
    - "S2.1: Using position: fixed for z-index (use transform instead)"
    - "S3.1: Dragover handler runs on every pixel move (debounce 100ms)"
    - "S4.1: Hard delete contacts during merge (use soft delete only)"
    - "S1.2: Testing only light theme (test dark theme too)"
    - "S4.1: No backup before first production merge (TEST rollback first)"

