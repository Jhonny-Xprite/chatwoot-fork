        evidence: "Manual test screenshot"

      - item: "Status filter works (real-time updates < 500ms)"
        responsibility: "@qa"
        evidence: "Performance profiler screenshot"

      - item: "Filters combine correctly (status + search)"
        responsibility: "@qa"
        evidence: "Test case results"

      - item: "URL params persist (?status=...)"
        responsibility: "@qa"
        evidence: "Manual verification"

  gate_wave_3:
    name: "Wave 3 QA Gate (Drag & Drop Performance)"
    timing: "After S3.1 complete"
    verdict_required: "PASS"

    checks:
      - item: "Maintains 60 FPS with 100+ cards"
        responsibility: "@qa"
        evidence: "Lighthouse Performance audit (60 FPS target)"

      - item: "Drag animation smooth (200-300ms)"
        responsibility: "@qa"
        evidence: "Manual testing, DevTools frame rate"

      - item: "Firefox compatibility verified"
        responsibility: "@qa"
        evidence: "Firefox DevTools Performance tab, no errors"

      - item: "Touch events work (mobile/tablet)"
        responsibility: "@qa"
        evidence: "Test on 2+ real devices"

      - item: "Drag error handling (network, permission failures)"
