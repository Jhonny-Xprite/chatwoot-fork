# ============================================================================
# RISK MATRIX & MITIGATION
# ============================================================================
risk_assessment:
  high_risks:
    - id: "R-001"
      title: "S4.1 Data Loss During Contact Merge"
      severity: "CRITICAL"
      likelihood: "LOW (soft deletes protect)"
      impact: "Loss of conversation history (unrecoverable)"
      mitigation:
        - "Implement soft deletes (is_deleted flag)"
        - "Create audit trail (contact_merge_logs table)"
        - "Backup before production merge"
        - "Rollback procedure documented and tested"
      owner: "@architect"
      test_evidence: "Database recovery test (restore from backup)"

    - id: "R-002"
      title: "S3.1 Performance Degradation with 100+ Cards"
      severity: "HIGH"
      likelihood: "MEDIUM"
      impact: "Drag & drop becomes unusable (below 60 FPS)"
      mitigation:
        - "Implement virtual scrolling"
        - "Debounce dragover events (100ms)"
        - "Use CSS transforms instead of position"
        - "Performance testing at 50, 100, 500 cards"
      owner: "@architect"
      test_evidence: "Lighthouse Performance audit (60 FPS target)"

    - id: "R-003"
      title: "S1.2 Accessibility Compliance Gaps"
      severity: "HIGH"
      likelihood: "MEDIUM"
      impact: "Legal/compliance risk, accessibility issues for users"
      mitigation:
        - "Automated testing (jest-axe)"
        - "Manual WebAIM + Coblis testing"
        - "Pre-commit accessibility validation"
      owner: "@qa"
      test_evidence: "jest-axe 0 violations, WebAIM contrast report"

    - id: "R-004"
      title: "S2.1 Z-Index Affects Other Overlays"
      severity: "MEDIUM"
      likelihood: "MEDIUM"
      impact: "Modal/tooltip z-index conflicts, user confusion"
      mitigation:
        - "Audit all components with z-index >= 100"
        - "Document z-index strategy"
        - "Integration test: modal + filter dropdown open simultaneously"
      owner: "@architect"
      test_evidence: "Integration test results"

    - id: "R-005"
      title: "S4.1 Fuzzy Match False Positives"
      severity: "MEDIUM"
      likelihood: "MEDIUM"
      impact: "Wrong contacts merged, requires manual cleanup"
      mitigation:
        - "Manual confirmation before merge (user sees preview)"
        - "Thorough fuzzy match testing with test data"
        - "0.95+ threshold (strict)"
      owner: "@qa"
      test_evidence: "False positive test report"

  medium_risks:
    - id: "R-006"
      title: "S3.1 Firefox Touch Event Compatibility"
      severity: "MEDIUM"
      likelihood: "LOW"
      impact: "Touch drag doesn't work on Firefox mobile"
      mitigation:
        - "Explicit Firefox testing in AC"
        - "Pointer events API (not Touch API)"
        - "DevTools emulation for mobile"
      owner: "@qa"
      test_evidence: "Firefox touch drag test (real device or emulation)"

    - id: "R-007"
      title: "S1.3 Unread State Sync Issues"
      severity: "MEDIUM"
      likelihood: "LOW"
      impact: "Unread state inconsistent between tabs"
      mitigation:
        - "Use Vuex store (single source of truth)"
        - "Backend sync on every mark-unread"
        - "Test multi-tab scenario"
      owner: "@dev"
      test_evidence: "Multi-tab sync test"

# ============================================================================
# CONTINGENCY & ROLLBACK PLANS
# ============================================================================
contingency_planning:
  timeline_buffer:
    baseline: "18-24 days"
    recommended_buffer: "2-4 days (11-22%)"
    rationale: "Accessibility testing (S1.2) and data integrity (S4.1) unpredictable"
    usage: "Only if critical issues found in QA gate; don't use proactively"

  rollback_strategy:
    wave_1:
      risk: "Low (CSS only, no DB changes for S1.1/S1.2)"
      rollback: "Simple git revert + CSS reload"
      time_to_rollback: "5 minutes"

    wave_2:
      risk: "Low (CSS + filter logic, no DB changes)"
      rollback: "Git revert + cache clear"
      time_to_rollback: "5 minutes"

    wave_3:
      risk: "Medium (frontend changes only, no data changes)"
      rollback: "Git revert, restart services"
      time_to_rollback: "10 minutes"

    wave_4:
      risk: "CRITICAL (database changes, data merges)"
      rollback: "Restore from pre-merge backup (pg_restore)"
      time_to_rollback: "30-60 minutes"
      procedure: |
        1. Stop application server
        2. Run: pg_restore -d chatwoot_prod backup_contacts_TIMESTAMP.sql
        3. Revert code: git revert commit-hash
        4. Restart application server
        5. Verify data integrity: SELECT COUNT(*) FROM contacts WHERE is_deleted = false;

  emergency_escalation:
    trigger: "Critical issue blocking wave completion"
    escalate_to: "@architect"
    decision_framework: |
      1. Can issue be fixed in < 4 hours? → Fix in current wave
      2. Requires investigation (> 4 hours)? → Escalate to @architect for decision
      3. Data integrity at risk? → Stop immediately, escalate with rollback plan
      4. Regulatory/compliance risk? → Escalate to PM + @architect

