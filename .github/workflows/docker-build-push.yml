name: Build and Push Docker Image to GHCR

on:
  push:
    branches:
      - feat/crm-advanced-filters-automation
      - main
      - develop
    paths:
      - 'Dockerfile'
      - 'app/**'
      - 'config/**'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'package.json'
      - 'pnpm-lock.yaml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chatwoot-crm:latest
            ghcr.io/${{ github.repository_owner }}/chatwoot-crm:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/chatwoot-crm:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/chatwoot-crm:buildcache,mode=max

      - name: Image pushed successfully
        run: |
          echo "✅ Docker image pushed to GitHub Container Registry"
          echo "Image: ghcr.io/${{ github.repository_owner }}/chatwoot-crm:latest"
