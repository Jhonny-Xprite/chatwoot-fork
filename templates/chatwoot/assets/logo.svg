<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" fill="url(#grad1)" rx="10"/>

  <!-- Kanban Board Columns -->
  <g fill="white" opacity="0.9">
    <!-- Column 1 -->
    <rect x="8" y="15" width="18" height="70" rx="3"/>
    <!-- Column 2 -->
    <rect x="32" y="15" width="18" height="70" rx="3"/>
    <!-- Column 3 -->
    <rect x="56" y="15" width="18" height="70" rx="3"/>
  </g>

  <!-- Cards in columns -->
  <g fill="white" opacity="0.6">
    <!-- Card 1 in Column 1 -->
    <rect x="10" y="20" width="14" height="12" rx="2"/>
    <!-- Card 2 in Column 1 -->
    <rect x="10" y="36" y="48" width="14" height="12" rx="2"/>

    <!-- Card in Column 2 -->
    <rect x="34" y="28" width="14" height="12" rx="2"/>
    <!-- Card in Column 2 -->
    <rect x="34" y="56" width="14" height="12" rx="2"/>

    <!-- Card in Column 3 -->
    <rect x="58" y="35" width="14" height="12" rx="2"/>
  </g>

  <!-- CRM Text -->
  <text x="50" y="92" font-size="10" font-weight="bold" text-anchor="middle" fill="white">
    CRM
  </text>
</svg>
