# Configurações reutilizáveis (Anchors) para evitar repetição de código
x-chatwoot-image: &chatwoot-image clientes-tools-chatwoot:crm
x-chatwoot-build: &chatwoot-build
  context: .
  dockerfile: ./Dockerfile

services:
  # --- Banco de Dados PostgreSQL ---
  postgres:
    # container_name removido para evitar conflitos em deploys paralelos (staging/prod)
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-chatwoot_production}
      POSTGRES_USER: ${POSTGRES_USERNAME:-chatwoot_prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatwoot_prod}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME:-chatwoot_prod} -d ${POSTGRES_DATABASE:-chatwoot_production}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Cache e Filas Redis ---
  redis:
    image: valkey/valkey:7.2.5-alpine
    command: valkey-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: always
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Servidor Principal do Chatwoot (Web) ---
  chatwoot:
    image: *chatwoot-image
    build: *chatwoot-build
    env_file:
      - .env
    environment:
      - RAILS_ENV=production
      - NODE_ENV=production
      - INSTALLATION_OWNER_EMAIL=${INSTALLATION_OWNER_EMAIL:-contato@aiox.com.br}
      - INSTALLATION_OWNER_PASSWORD=${INSTALLATION_OWNER_PASSWORD:-Chatwoot123!}
      - INSTALLATION_OWNER_NAME=${INSTALLATION_OWNER_NAME:-Admin AIOX}
      - DEFAULT_LOCALE=pt_BR
      - ENABLE_ACCOUNT_SIGNUP=false
      - SECRET_KEY_BASE=${SECRET_KEY_BASE:-840420d98e0aeb2e4f77fc20d99508987cd46d061bc3f041e6c9319fe4358a4eed9bfbea9d8deab4cbae2db329361708ffbe2ef343150c8f2fbfe28a1e23247d}
      - POSTGRES_HOST=postgres
      - POSTGRES_DATABASE=${POSTGRES_DATABASE:-chatwoot_production}
      - POSTGRES_USERNAME=${POSTGRES_USERNAME:-chatwoot_prod}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-chatwoot_prod}
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - chatwoot-storage:/app/storage
      - chatwoot-logs:/app/log
    restart: always
    command: bundle exec rails s -p 3000 -b 0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 60s

  # --- Processador de Fundo (Sidekiq) ---
  sidekiq:
    image: *chatwoot-image
    build: *chatwoot-build
    env_file:
      - .env
    environment:
      - RAILS_ENV=production
      - NODE_ENV=production
      - SECRET_KEY_BASE=${SECRET_KEY_BASE:-840420d98e0aeb2e4f77fc20d99508987cd46d061bc3f041e6c9319fe4358a4eed9bfbea9d8deab4cbae2db329361708ffbe2ef343150c8f2fbfe28a1e23247d}
      - POSTGRES_HOST=postgres
      - POSTGRES_DATABASE=${POSTGRES_DATABASE:-chatwoot_production}
      - POSTGRES_USERNAME=${POSTGRES_USERNAME:-chatwoot_prod}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-chatwoot_prod}
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chatwoot:
        condition: service_healthy
    volumes:
      - chatwoot-storage:/app/storage
      - chatwoot-logs:/app/log
    restart: always
    command: bundle exec sidekiq -C config/sidekiq.yml

# Definição dos Volumes de Dados
volumes:
  postgres-data:
  redis-data:
  chatwoot-storage:
  chatwoot-logs:
