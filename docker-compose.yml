# --- CHATWOOT COMPOSE ---
# Configuração otimizada para deploy via "Compose" no EasyPanel.
# As variáveis de ambiente devem ser configuradas na aba "Environment" do seu projeto.

services:
  # --- Banco de Dados PostgreSQL ---
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-chatwoot_production}
      POSTGRES_USER: ${POSTGRES_USERNAME:-chatwoot_prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatwoot_prod}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME:-chatwoot_prod} -d ${POSTGRES_DATABASE:-chatwoot_production}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Cache e Filas Redis ---
  redis:
    image: valkey/valkey:7.2.5-alpine
    command: valkey-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: always
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Servidor Principal do Chatwoot (Web) ---
  chatwoot:
    image: clientes-tools-chatwoot:crm
    build:
      context: .
      dockerfile: ./Dockerfile
    environment:
      - RAILS_ENV=${RAILS_ENV:-production}
      - NODE_ENV=${NODE_ENV:-production}
      - INSTALLATION_ENV=docker
      
      # URLs e Segurança
      - FRONTEND_URL=${FRONTEND_URL}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      
      # Banco de Dados
      - POSTGRES_HOST=postgres
      - POSTGRES_DATABASE=${POSTGRES_DATABASE:-chatwoot_production}
      - POSTGRES_USERNAME=${POSTGRES_USERNAME:-chatwoot_prod}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-chatwoot_prod}
      
      # Redis
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      
      # IAs
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      
      # Configurações Padrão
      - RAILS_LOG_TO_STDOUT=${RAILS_LOG_TO_STDOUT:-true}
      - RAILS_SERVE_STATIC_FILES=${RAILS_SERVE_STATIC_FILES:-true}
      - DEFAULT_LOCALE=${DEFAULT_LOCALE:-pt_BR}
      - ENABLE_ACCOUNT_SIGNUP=${ENABLE_ACCOUNT_SIGNUP:-false}
      
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - chatwoot-storage:/app/storage
      - chatwoot-logs:/app/log
    restart: always
    command: sh -c "bundle exec rails db:prepare && bundle exec rails s -p 3000 -b 0.0.0.0"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 120s

  # --- Processador de Fundo (Sidekiq) ---
  sidekiq:
    image: clientes-tools-chatwoot:crm
    environment:
      - RAILS_ENV=${RAILS_ENV:-production}
      - NODE_ENV=${NODE_ENV:-production}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      
      - POSTGRES_HOST=postgres
      - POSTGRES_DATABASE=${POSTGRES_DATABASE:-chatwoot_production}
      - POSTGRES_USERNAME=${POSTGRES_USERNAME:-chatwoot_prod}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-chatwoot_prod}
      
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chatwoot:
        condition: service_healthy
    volumes:
      - chatwoot-storage:/app/storage
      - chatwoot-logs:/app/log
    restart: always
    command: bundle exec sidekiq -C config/sidekiq.yml

volumes:
  postgres-data:
  redis-data:
  chatwoot-storage:
  chatwoot-logs:
