services:
  a2-postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_2024
    volumes:
      - a2-postgres-data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  a2-redis:
    image: valkey/valkey:7.2.5-alpine
    command: valkey-server --appendonly yes
    volumes:
      - a2-redis-data:/data
    restart: always
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  a2-chatwoot:
    image: jhonnyxprite/chatwoot-crm:latest
    environment:
      DATABASE_URL: postgresql://postgres:postgres_secure_2024@a2-postgres:5432/chatwoot
      REDIS_URL: redis://a2-redis:6379
      SECRET_KEY_BASE: change_me_with_random_64_chars_minimum
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      FRONTEND_URL: http://localhost:3000
      RAILS_SERVE_STATIC_FILES: "true"
      FEATURE_CRM_ENABLED: "true"
    depends_on:
      a2-postgres:
        condition: service_healthy
      a2-redis:
        condition: service_healthy
    volumes:
      - a2-chatwoot-storage:/app/storage
      - a2-chatwoot-logs:/app/log
    restart: always
    command: >
      sh -c "bundle exec rails db:chatwoot_prepare &&
             bundle exec rails s -p 3000 -b 0.0.0.0"

  a2-sidekiq:
    image: jhonnyxprite/chatwoot-crm:latest
    environment:
      DATABASE_URL: postgresql://postgres:postgres_secure_2024@a2-postgres:5432/chatwoot
      REDIS_URL: redis://a2-redis:6379
      SECRET_KEY_BASE: change_me_with_random_64_chars_minimum
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      FEATURE_CRM_ENABLED: "true"
    depends_on:
      - a2-postgres
      - a2-redis
      - a2-chatwoot
    volumes:
      - a2-chatwoot-storage:/app/storage
      - a2-chatwoot-logs:/app/log
    restart: always
    command: bundle exec sidekiq -C config/sidekiq.yml

volumes:
  postgres_data:
  redis_data:
  chatwoot_storage:
  chatwoot_logs:
