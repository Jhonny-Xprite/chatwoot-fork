services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_2024
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatwoot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Cache e Filas Redis ---
  redis:
    image: valkey/valkey:7.2.5-alpine
    command: valkey-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: always
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Servidor Principal do Chatwoot (Web) ---
  chatwoot:
    image: clientes-tools-chatwoot:crm
    build:
      context: .
      dockerfile: ./Dockerfile
    environment:
      # ═══════════════════════════════════════════════════════════════════════════════
      # 🔴 OBRIGATÓRIAS - PRÉ-CONFIGURADAS (STANDALONE)
      # ═══════════════════════════════════════════════════════════════════════════════
      DATABASE_URL: postgresql://postgres:postgres_secure_2024@postgres:5432/chatwoot
      REDIS_URL: redis://redis:6379
      SECRET_KEY_BASE: 840420d98e0aeb2e4f77fc20d99508987cd46d061bc3f041e6c9319fe4358a4eed9bfbea9d8deab4cbae2db329361708ffbe2ef343150c8f2fbfe28a1e23247d
      RAILS_ENV: production
      NODE_ENV: production
      INSTALLATION_ENV: docker
      
      # ═══════════════════════════════════════════════════════════════════════════════
      # 🟢 DOMÍNIO & CONFIGURAÇÕES PADRÃO CHATWOOT
      # ═══════════════════════════════════════════════════════════════════════════════
      FRONTEND_URL: https://clientes-tools-chatwoot-stage.am5xdk.easypanel.host
      RAILS_LOG_TO_STDOUT: "true"
      RAILS_SERVE_STATIC_FILES: "true"
      DEFAULT_LOCALE: pt_BR
      ENABLE_ACCOUNT_SIGNUP: "false"
      FEATURE_CRM_ENABLED: "true"
      
      # ═══════════════════════════════════════════════════════════════════════════════
      # 🧠 CHAVES DE IA (Substitua as chaves reais pelo painel, se preferir, ou deixe hardcoded aqui)
      # ═══════════════════════════════════════════════════════════════════════════════
      OPENAI_API_KEY: "sk-proj-SUA_CHAVE_AQUI"
      GEMINI_API_KEY: "AIzaSySUA_CHAVE_AQUI"
      ANTHROPIC_API_KEY: "sk-ant-api03-SUA_CHAVE_AQUI"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - chatwoot-storage:/app/storage
      - chatwoot-logs:/app/log
    restart: always
    command: sh -c "bundle exec rails db:chatwoot_prepare && bundle exec rails s -p 3000 -b 0.0.0.0"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 120s

  # --- Processador de Fundo (Sidekiq) ---
  sidekiq:
    image: clientes-tools-chatwoot:crm
    environment:
      DATABASE_URL: postgresql://postgres:postgres_secure_2024@postgres:5432/chatwoot
      REDIS_URL: redis://redis:6379
      SECRET_KEY_BASE: 840420d98e0aeb2e4f77fc20d99508987cd46d061bc3f041e6c9319fe4358a4eed9bfbea9d8deab4cbae2db329361708ffbe2ef343150c8f2fbfe28a1e23247d
      RAILS_ENV: production
      NODE_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      FEATURE_CRM_ENABLED: "true"
      
      OPENAI_API_KEY: "sk-proj-SUA_CHAVE_AQUI"
      GEMINI_API_KEY: "AIzaSySUA_CHAVE_AQUI"
      ANTHROPIC_API_KEY: "sk-ant-api03-SUA_CHAVE_AQUI"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chatwoot:
        condition: service_healthy
    volumes:
      - chatwoot-storage:/app/storage
      - chatwoot-logs:/app/log
    restart: always
    command: bundle exec sidekiq -C config/sidekiq.yml

volumes:
  postgres-data:
  redis-data:
  chatwoot-storage:
  chatwoot-logs:
