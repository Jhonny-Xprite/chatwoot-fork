version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: chatwoot-postgres
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_2024
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: valkey/valkey:7.2.5-alpine
    container_name: chatwoot-redis
    command: valkey-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  chatwoot:
    image: jhonnyxprite/chatwoot-crm:latest
    container_name: chatwoot-app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres_secure_2024@postgres:5432/chatwoot
      REDIS_URL: redis://redis:6379
      SECRET_KEY_BASE: change_me_with_random_64_chars_minimum
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      FRONTEND_URL: http://localhost:3000
      RAILS_SERVE_STATIC_FILES: "true"
      FEATURE_CRM_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - chatwoot_storage:/app/storage
      - chatwoot_logs:/app/log
    restart: always
    command: >
      sh -c "bundle exec rails db:chatwoot_prepare &&
             bundle exec rails s -p 3000 -b 0.0.0.0"

  sidekiq:
    image: jhonnyxprite/chatwoot-crm:latest
    container_name: chatwoot-sidekiq
    environment:
      DATABASE_URL: postgresql://postgres:postgres_secure_2024@postgres:5432/chatwoot
      REDIS_URL: redis://redis:6379
      SECRET_KEY_BASE: change_me_with_random_64_chars_minimum
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      FEATURE_CRM_ENABLED: "true"
    depends_on:
      - postgres
      - redis
      - chatwoot
    volumes:
      - chatwoot_storage:/app/storage
      - chatwoot_logs:/app/log
    restart: always
    command: bundle exec sidekiq -C config/sidekiq.yml

volumes:
  postgres_data:
  redis_data:
  chatwoot_storage:
  chatwoot_logs:
