# --- CHATWOOT AUTO-CONFIG (EASYPANEL) ---
# Este arquivo é otimizado para o fluxo "Create from Schema" do EasyPanel.
# As variáveis ${...} são preenchidas automaticamente pelo formulário do Schema.

services:
  # --- Banco de Dados PostgreSQL ---
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${postgresDatabase:-chatwoot_production}
      POSTGRES_USER: ${postgresUser:-chatwoot_prod}
      POSTGRES_PASSWORD: ${postgresPassword}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${postgresUser:-chatwoot_prod} -d ${postgresDatabase:-chatwoot_production}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Cache e Filas Redis ---
  redis:
    image: valkey/valkey:7.2.5-alpine
    command: valkey-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: always
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Servidor Principal do Chatwoot (Web) ---
  chatwoot:
    image: clientes-tools-chatwoot:crm
    build:
      context: .
      dockerfile: ./Dockerfile
    environment:
      - RAILS_ENV=production
      - NODE_ENV=production
      - INSTALLATION_ENV=docker
      
      # URLs e Segurança (Puxados do Schema)
      - FRONTEND_URL=${frontendUrl}
      - SECRET_KEY_BASE=${secretKeyBase}
      
      # Banco de Dados (Puxados do Schema)
      - POSTGRES_HOST=postgres
      - POSTGRES_DATABASE=${postgresDatabase:-chatwoot_production}
      - POSTGRES_USERNAME=${postgresUser:-chatwoot_prod}
      - POSTGRES_PASSWORD=${postgresPassword}
      
      # Redis
      - REDIS_URL=redis://redis:6379
      
      # IAs (Puxados do Schema)
      - OPENAI_API_KEY=${openaiApiKey}
      - ANTHROPIC_API_KEY=${anthropicApiKey}
      - GEMINI_API_KEY=${geminiApiKey}
      
      # Outros
      - RAILS_LOG_TO_STDOUT=true
      - RAILS_SERVE_STATIC_FILES=true
      - DEFAULT_LOCALE=pt_BR
      - ENABLE_ACCOUNT_SIGNUP=false
      
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - chatwoot-storage:/app/storage
      - chatwoot-logs:/app/log
    restart: always
    command: sh -c "bundle exec rails db:prepare && bundle exec rails s -p 3000 -b 0.0.0.0"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 120s

  # --- Processador de Fundo (Sidekiq) ---
  sidekiq:
    image: clientes-tools-chatwoot:crm
    environment:
      - RAILS_ENV=production
      - NODE_ENV=production
      - SECRET_KEY_BASE=${secretKeyBase}
      - POSTGRES_HOST=postgres
      - POSTGRES_DATABASE=${postgresDatabase:-chatwoot_production}
      - POSTGRES_USERNAME=${postgresUser:-chatwoot_prod}
      - POSTGRES_PASSWORD=${postgresPassword}
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${openaiApiKey}
      - ANTHROPIC_API_KEY=${anthropicApiKey}
      - GEMINI_API_KEY=${geminiApiKey}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chatwoot:
        condition: service_healthy
    volumes:
      - chatwoot-storage:/app/storage
      - chatwoot-logs:/app/log
    restart: always
    command: bundle exec sidekiq -C config/sidekiq.yml

volumes:
  postgres-data:
  redis-data:
  chatwoot-storage:
  chatwoot-logs:
